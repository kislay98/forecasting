[project]
name = "forecasting"
version = "0.1.0"
description = "Leak-free multi-horizon forecasting and uncertainty study (Phase 1: honest point forecast)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14.2",
    # Phase 2: GARCH-family conditional variance. Was dev-only in Phase 1, where it
    # existed only to check our Model Confidence Set against a second implementation.
    "arch>=8.0.0",
    # Determinism: the GARCH optimiser's result depends on how many BLAS threads it
    # runs with, and joblib gives workers a different thread count than an in-process
    # run. Pinning it makes a fit reproducible regardless of n_jobs (P3-4).
    "threadpoolctl>=3.1",
]

[project.scripts]
forecast = "forecasting.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecasting"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/*.md are verbatim snapshots of the Claude Docs pages: never reformat their code blocks.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length. SIM300: H and T are the spec's names, not constants.
ignore = ["E501", "SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The canary tier (L3 with every model, hours) is skipped unless asked for: -m canary.
addopts = "-ra -m 'not canary'"
markers = [
    "slow: statsmodels-heavy; CI runs them, skip locally with -m 'not slow'",
    "canary: L3 over 200 random walks with every model; nightly, or by hand with -m canary",
]
filterwarnings = ["error::FutureWarning"]
