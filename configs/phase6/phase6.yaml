# Phase 6: block-bootstrap innovations (OP-2), Nifty 50, the P3 and P4 shape.
#
# The design is Phase 4's exactly: same series, start, horizons, origins, seed and path
# count. The model list is Phase 4's five plus their three block counterparts, so the
# iid and block samplers run side by side on the same origins, in the same run, on the
# same machine. That is deliberate: the registered stores of P3 and P4 were written on a
# different platform, and GARCH fits move in their last digits between BLAS builds
# (P3-4), so the comparison that isolates the sampler is the one inside this store.
#
# This directory holds the uncorrected arm, decided by P3's rules. Its three siblings,
# nifty_conformal/, sp500/ and sp500_conformal/, hold the other three arms of the 2 x 2
# (market x conformal layer). Read configs/phase6/gate.yaml first.
seed: 20260926                        # Phase 4's seed, unchanged
n_jobs: 4                             # parallel folds; not part of the run_id
n_paths: 10000                        # simulated paths per fold; IS part of the run_id
levels: [0.5, 0.8, 0.9, 0.95, 0.99]
series:
  - id: nifty50
    source: csv:../../data/nifty50.csv  # NSE price index, weekend sessions dropped (M8-5)
    columns: {date: Date, value: Close}
    date_format: "%d %b %Y"
    start: 1996-01-01                   # as registered for Phase 1 (M8-6)
    freq: trading_days
    season: none
    target: cumulative_returns          # log(p_t+h / p_t), as registered for Phase 3
    H: 20
    decision_horizons: [1, 5, 20]
    origin_step: 20                     # non-overlapping, so independence is testable at h = 20
    n_dev_origins: 100
    n_test_origins: 200
    models:
      - zero_return_fhs                 # the registered CRPS comparator, iid draws
      - ewma
      - garch_normal
      - garch
      - gjr_garch                       # the P3 and P4 primary, iid draws
      - ewma_block
      - garch_block
      - gjr_garch_block                 # the P6 primary: gjr_garch with blocks of 10
