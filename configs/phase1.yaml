# Phase 1 run config from the spec (scope update, 22 Sep 2026). Pre-registered with
# configs/gate.yaml (P1, 23 Sep 2026): change either only with a new gate commit.
seed: 20260922
n_jobs: 4                             # parallel folds; not part of the run_id
series:
  - id: nifty50
    source: csv:../data/nifty50.csv     # NSE historical index data (price index, not TRI)
    columns: {date: Date, value: Close}
    date_format: "%d %b %Y"             # NSE export format, e.g. 03 Jul 1990
    start: 1996-01-01                   # index base date is 03 Nov 1995; earlier values are
                                        # back-computed and the early 1990s have multi-week gaps
    freq: trading_days                  # exchange closures are not missing data
    season: none
    target: returns                     # log returns, computed inside each fold (M2)
    H: 20                               # about one trading month
    decision_horizons: [1, 5, 20]       # day, week, month

  - id: electricity
    source: fred:IPG2211A2N             # cached under configs/data/fred/ on first load
    start: 1990-01-01                   # FRED starts in 1939; 36 years is enough history
    n_test_origins: 120                 # 10 years of test origins: n / h = 5 at h = 24, so
                                        # DM-HLN can run at every decision horizon (M7-3)
    freq: monthly
    season: 12
    target: level
    positive: true
    H: 24
    decision_horizons: [1, 12, 24]
